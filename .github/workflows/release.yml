name: Build and Release DMG

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build DMG on macOS
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          swift --version

      - name: Grant executable permissions
        run: |
          chmod +x build.command 打包DMG.command 安裝行雲_繁-A.command 反安裝行雲_繁-A.command src/unifyIME/build.sh || true

      - name: Build and Package DMG
        run: |
          ./打包DMG.command

      - name: Verify DMG Output
        run: |
          ls -lh dist/
          test -f dist/行雲_繁-A_安裝磁碟.dmg

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: 行雲_繁-A ${{ github.ref_name }}
          files: dist/行雲_繁-A_安裝磁碟.dmg
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Upload Artifact (for workflow_dispatch manual runs)
        uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: 行雲_繁-A_安裝磁碟
          path: dist/行雲_繁-A_安裝磁碟.dmg
